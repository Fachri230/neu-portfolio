<!doctype html>
<!-- Declares this file as an HTML5 document -->
<html lang="en">
  <head>
    <!-- Character encoding so all letters/symbols render correctly -->
    <meta charset="UTF-8" />
    <!-- Makes the layout scale properly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Short summary shown by search engines -->
    <meta name="description" content="Portfolio of Your Name, a product designer and front-end developer." />
    <!-- Colors the mobile browser bar with the abyss blue -->
    <meta name="theme-color" content="#020f24" />

    <!-- Speeds up loading of Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loads the two fonts: Bricolage Grotesque (headings) and DM Sans (body) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Your Name | Portfolio</title>
  </head>
  <body>
    <!-- React mounts the whole app inside this empty div -->
    <div id="root"></div>
    <!-- Entry point of the app; "module" lets us use import/export -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
